# FaMaS — local development stack: PostgreSQL + API + client dev server.
#
#   cp server/.env.example server/.env     # then edit JWT_SECRET etc.
#   docker compose --env-file server/.env up --build
#
#   client  http://localhost:3030   (Vite dev server, /api proxied to the API)
#   api     http://localhost:5000/api/health
#   db      localhost:5432
#
# Compose reads variable substitutions from the repo-root `.env` by default,
# which is why the command above points it at server/.env with --env-file.
# Ports in that file can be overridden: API_PORT, PGPORT, CLIENT_PORT.

name: famas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-famas}
      POSTGRES_PASSWORD: ${PGPASSWORD:-famas}
      POSTGRES_DB: ${PGDATABASE:-famas}
    ports:
      # Exposed so the API can also be run bare-metal against this database.
      - "${PGPORT:-5432}:5432"
    volumes:
      - famas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      # In-cluster hostname of the postgres service; discrete PG* variables keep
      # the compose file self-contained even if POSTGRES_URL is also set.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-famas}
      PGPASSWORD: ${PGPASSWORD:-famas}
      PGDATABASE: ${PGDATABASE:-famas}
      PGSSL: ${PGSSL:-false}
      # Vite proxies /api from the client container, but the browser origin is
      # still checked, so list it here.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3030}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in server/.env or the environment}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-10}
      DB_CONNECT_RETRY_DELAY_MS: ${DB_CONNECT_RETRY_DELAY_MS:-2000}
    ports:
      - "${API_PORT:-5000}:5000"

  client:
    image: node:20-alpine
    working_dir: /app
    # Mount the source for hot reload; node_modules stays the image's own copy.
    volumes:
      - ./client:/app
      - famas_client_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      # Bind-mount file change events are unreliable on Docker Desktop.
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3030"
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-3030}:3030"

volumes:
  famas_pgdata:
  famas_client_modules:
